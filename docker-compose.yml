services:
  backend:
    image: giangxnt/clinic-be:latest
    container_name: clinic-be
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    image: giangxnt/clinic-frontend:latest
    container_name: clinic-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    ports:
      - "80:3000"
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
