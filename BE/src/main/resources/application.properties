spring.application.name=BE

# MySQL database configuration. Supply production values through environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/clinic_management?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Bootstrap administrator configuration.
admin.email=${ADMIN_EMAIL:admin@example.com}
admin.password=${ADMIN_PASSWORD:change-me}
admin.username=${ADMIN_USERNAME:admin}
admin.phone=${ADMIN_PHONE:0000000000}

# External service credentials. Do not place real values in this file.
gemini.api.key=${GEMINI_API_KEY:}
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}

sepay.api_secret=${SEPAY_API_SECRET:}
sepay.api-key=${SEPAY_API_KEY:}
sepay.bank=${SEPAY_BANK:}
sepay.acc=${SEPAY_ACCOUNT:}
sepay.template=${SEPAY_TEMPLATE:compact}
sepay.einvoice.base-url=${SEPAY_EINVOICE_BASE_URL:}
sepay.einvoice.client-id=${SEPAY_EINVOICE_CLIENT_ID:}
sepay.einvoice.client-secret=${SEPAY_EINVOICE_CLIENT_SECRET:}
sepay.einvoice.provider-account-id=${SEPAY_EINVOICE_PROVIDER_ACCOUNT_ID:}
sepay.einvoice.template-code=${SEPAY_EINVOICE_TEMPLATE_CODE:}
sepay.einvoice.invoice-series=${SEPAY_EINVOICE_INVOICE_SERIES:}
sepay.einvoice.item-unit=${SEPAY_EINVOICE_ITEM_UNIT:lan}
sepay.einvoice.default-tax-rate=${SEPAY_EINVOICE_DEFAULT_TAX_RATE:0}
sepay.einvoice.poll-interval-millis=${SEPAY_EINVOICE_POLL_INTERVAL_MILLIS:3000}
sepay.einvoice.poll-max-attempts=${SEPAY_EINVOICE_POLL_MAX_ATTEMPTS:20}

google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.refresh.token=${GOOGLE_REFRESH_TOKEN:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.url=${CLOUDINARY_URL:}

# Clinic configuration
clinic.insurance.ma-cskcb=${CLINIC_INSURANCE_MA_CSKCB:01012}
clinic.insurance.name=${CLINIC_INSURANCE_NAME:Phong kham Da khoa ABC}
clinic.insurance.province-code=${CLINIC_INSURANCE_PROVINCE_CODE:01}
clinic.receipt.async.enabled=${CLINIC_RECEIPT_ASYNC_ENABLED:true}
clinic.receipt.async.initial-delay-ms=${CLINIC_RECEIPT_ASYNC_INITIAL_DELAY_MS:15000}
clinic.receipt.async.scan-interval-ms=${CLINIC_RECEIPT_ASYNC_SCAN_INTERVAL_MS:3000}
clinic.receipt.async.batch-size=${CLINIC_RECEIPT_ASYNC_BATCH_SIZE:10}
clinic.receipt.async.processing-timeout-seconds=${CLINIC_RECEIPT_ASYNC_PROCESSING_TIMEOUT_SECONDS:300}

# JPA and server configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.charsetName=utf8mb4
spring.jpa.properties.hibernate.connection.collationConnection=utf8mb4_unicode_ci
server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
app.public.base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# Authentication
jwt.secret=${JWT_SECRET:local-development-only-change-this-before-deployment-2026}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:18000000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# File uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
