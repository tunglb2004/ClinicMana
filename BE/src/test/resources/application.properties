spring.application.name=BE

# Test-safe configuration: provide real integration credentials only through the environment.
jwt.secret=${JWT_SECRET:test-only-local-secret-change-before-deployment-2026}
jwt.access-token-expiration=18000000
jwt.refresh-token-expiration=604800000

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.refresh.token=${GOOGLE_REFRESH_TOKEN:}
cloudinary.url=${CLOUDINARY_URL:}

admin.email=${ADMIN_EMAIL:admin@example.com}
admin.password=${ADMIN_PASSWORD:change-me}
admin.username=${ADMIN_USERNAME:admin}
admin.phone=${ADMIN_PHONE:0000000000}
gemini.api.key=${GEMINI_API_KEY:}

sepay.api_secret=${SEPAY_API_SECRET:}
sepay.api-key=${SEPAY_API_KEY:}
sepay.bank=${SEPAY_BANK:}
sepay.acc=${SEPAY_ACCOUNT:}
sepay.template=${SEPAY_TEMPLATE:compact}
sepay.einvoice.base-url=${SEPAY_EINVOICE_BASE_URL:}
sepay.einvoice.client-id=${SEPAY_EINVOICE_CLIENT_ID:}
sepay.einvoice.client-secret=${SEPAY_EINVOICE_CLIENT_SECRET:}
sepay.einvoice.provider-account-id=${SEPAY_EINVOICE_PROVIDER_ACCOUNT_ID:}
sepay.einvoice.template-code=${SEPAY_EINVOICE_TEMPLATE_CODE:}
sepay.einvoice.invoice-series=${SEPAY_EINVOICE_INVOICE_SERIES:}
sepay.einvoice.item-unit=${SEPAY_EINVOICE_ITEM_UNIT:lan}
sepay.einvoice.default-tax-rate=${SEPAY_EINVOICE_DEFAULT_TAX_RATE:0}
sepay.einvoice.poll-interval-millis=${SEPAY_EINVOICE_POLL_INTERVAL_MILLIS:3000}
sepay.einvoice.poll-max-attempts=${SEPAY_EINVOICE_POLL_MAX_ATTEMPTS:20}
clinic.receipt.async.enabled=false
